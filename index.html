<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SB RM">
<title>Sharief Bhai</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  /* instant first paint while Google loads the app frame (~2–4 s) — same as the KK app */
  #splash { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; z-index: 2; transition: opacity .25s; }
  #splash img { width: 240px; max-width: 64vw; height: auto; animation: sbin .5s ease-out both; }
  #splash .bar { width: 120px; height: 4px; border-radius: 4px; background: #2a2a2a; overflow: hidden; }
  #splash .bar i { display: block; width: 40%; height: 100%; background: #f5b301; border-radius: 4px; animation: sbb 1s ease-in-out infinite; }
  @keyframes sbb { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  @keyframes sbin { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<!-- SB RM App wrapper: keeps the login in this page's own (first-party) storage, which phones don't wipe,
     and passes it to the Apps Script app inside the frame. Only these keys are ever stored. -->
<div id="splash"><img src="logo.png" alt="Sharief Bhai"><div class="bar"><i></i></div></div>
<iframe id="app" title="Sharief Bhai" allow="camera *; geolocation *; clipboard-write *"></iframe>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbyV_WeWKZEp6kFa9msi1ChNCLMll3IqkdejMtuZkHAs69bSt49_AqCz1MO7hpML9B3uSQ/exec';
  var KEYS = ['sbAuth', 'sbBoot2', 'sbToday'];
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  // the login is handed to the app by postMessage (sbGet below), never in the URL
  document.getElementById('app').src = EXEC + '?wt=1';
  // hide the splash once the app inside the frame has started (it asks for sbGet on boot); fallback after 8 s
  function hideSplash() { var s = document.getElementById('splash'); if (s) { s.style.opacity = 0; setTimeout(function () { s.remove(); }, 300); } }
  setTimeout(hideSplash, 8000);
  window.addEventListener('message', function (e) {
    // only the Apps Script sandbox frame that lives INSIDE our own iframe may talk to this page
    if (!/^https:\/\/n-[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
    var app = document.getElementById('app').contentWindow, w = e.source, mine = false;
    for (var i = 0; i < 4 && w; i++) { if (w === app) { mine = true; break; } if (w === w.parent) break; w = w.parent; }
    if (!mine) return;
    var d = e.data; if (!d || typeof d !== 'object') return;
    if (Array.isArray(d.sbSet) && KEYS.indexOf(d.sbSet[0]) >= 0 && (d.sbSet[1] === null || typeof d.sbSet[1] === 'string')) {
      try { if (d.sbSet[1] === null) localStorage.removeItem(d.sbSet[0]); else localStorage.setItem(d.sbSet[0], d.sbSet[1]); } catch (x) {}
    }
    if (Array.isArray(d.sbGet)) { setTimeout(hideSplash, 150);
      var out = {};
      d.sbGet.forEach(function (k) { if (KEYS.indexOf(k) >= 0) out[k] = get(k); });
      e.source.postMessage({ sbVals: out }, e.origin);
    }
  });
</script>
</body>
</html>
